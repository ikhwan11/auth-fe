<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Wans Portal</title>

    <script>
      const savedTheme = localStorage.getItem("theme");

      if (
        savedTheme === "dark" ||
        (!savedTheme &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark-mode");
      }
    </script>

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="toast" class="toast">
      <span id="toast-message"></span>
    </div>

    <button id="theme-toggle" class="theme-toggle" type="button">🌙</button>

    <div class="login-container">
      <h1 class="welcome-text">Welcome to<br />Wans Portal</h1>

      <form class="login-form" id="auth-form">
        <div class="input-group">
          <input
            type="text"
            id="employee-no"
            placeholder="Employee Number"
            autocomplete="username"
            required
          />
        </div>

        <div id="employee-info" class="employee-info hidden">
          <p id="employee-name"></p>
          <span id="employee-position"></span>
        </div>

        <div id="password-section" class="hidden">
          <div class="input-group">
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="current-password"
            />
          </div>
        </div>

        <div id="confirm-password-section" class="hidden">
          <div class="input-group">
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm Password"
              autocomplete="new-password"
            />
          </div>
        </div>

        <p id="auth-message" class="auth-message"></p>

        <button type="submit" class="login-btn hidden" id="auth-button">
          LOGIN
        </button>
      </form>

      <div class="login-footer">
        <p>&copy; <span id="copyright-year"></span> Ikhwan Sulestra</p>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
