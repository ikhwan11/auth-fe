<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Wans Portal</title>

    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <!-- ==============================
         TOAST
         ============================== -->

    <div id="toast" class="toast">
      <span id="toast-message"></span>
    </div>

    <!-- ==============================
         THEME TOGGLE
         ============================== -->

    <button
      type="button"
      id="theme-toggle"
      class="theme-toggle"
      aria-label="Toggle theme"
    >
      🌙
    </button>

    <!-- ==============================
         LOGIN CONTAINER
         ============================== -->

    <main class="login-container">
      <h1 class="welcome-text">
        Welcome to<br />
        Wans Portal
      </h1>

      <!-- ==============================
           AUTH FORM
           ============================== -->

      <form id="auth-form" class="login-form">
        <!-- Employee Number -->

        <div class="input-group">
          <input
            type="text"
            id="employee-no"
            placeholder="Employee Number"
            autocomplete="username"
            required
          />
        </div>

        <!-- Employee Information -->

        <div id="employee-info" class="employee-info">
          <p id="employee-name"></p>

          <span id="employee-position"></span>
        </div>

        <!-- Password -->

        <div id="password-section" class="form-section">
          <div class="input-group password-input">
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="current-password"
            />
            <button
              type="button"
              id="password-toggle"
              class="password-toggle"
              aria-label="Show password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->

        <div id="confirm-password-section" class="form-section">
          <div class="input-group password-input">
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm Password"
              autocomplete="new-password"
            />
            <button
              type="button"
              id="confirm-password-toggle"
              class="password-toggle"
              aria-label="Show confirm password"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Auth Message -->

        <p id="auth-message" class="auth-message"></p>

        <!-- Submit Button -->

        <button type="submit" id="auth-button" class="login-btn">LOGIN</button>
      </form>

      <!-- ==============================
           FOOTER
           ============================== -->

      <div class="login-footer">
        <p>
          Copyright ©
          <span id="copyright-year"></span>
          Ikhwan Sulestra
        </p>
      </div>
    </main>

    <!-- ==============================
         JAVASCRIPT
         ============================== -->

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
